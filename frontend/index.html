<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do lista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="app-title">ToDo App</h1>
    </header>
    
   
    <main>
        <!-- ToDo Appen -->
        <div id="todo-app">

            <div>
            <h1 class="app-title">Din Lista</h1>
            <form class="formStyle">
                <input id="todo-input" type="text" placeholder="Lägg till en todo">
                <button class="buttonStyle" type="submit">Lägg till</button> 
            </form>
            </div>

            <ul id="todo-list">
                <!-- todo items will be inserted here by JavaScript --> 
                
            </ul>
            <button class="buttonStyle" id="clearBtn">Töm listan</button> 
        </div>
    </main>
    
    <footer>&copy; Sofie Törnqvist</footer>


  <script src="app.js"></script>  
</body>
</html>
